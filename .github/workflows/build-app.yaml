name: "[app] Build"

# Builds the E-Paper Studio desktop app for macOS, Windows and Linux.
#
# - on a pull request that touches the app, or on demand: builds all three and
#   keeps the installers as run artifacts;
# - on a tag like `v0.1.0`: builds all three and attaches them to a draft
#   GitHub release.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "apps/studio/**"
      - ".github/workflows/build-app.yaml"
      - "pnpm-lock.yaml"

concurrency:
  group: app-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_DIR: apps/studio

jobs:
  # A fast gate, so a typo does not burn three platform runners.
  check:
    name: "Check"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/studio/src-tauri
            apps/studio/src-tauri/crates/epaper-core

      # Scoped to this app: the landing site's toolchain is not needed to build
      # or check the desktop app.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @epaper-studio/studio...

      # The image pipeline has no Tauri dependency, so it tests without a
      # webview toolchain installed.
      - name: Test the image pipeline
        run: cargo test --manifest-path "$APP_DIR/src-tauri/crates/epaper-core/Cargo.toml"

      - name: Lint the image pipeline
        run: cargo clippy --manifest-path "$APP_DIR/src-tauri/crates/epaper-core/Cargo.toml" --all-targets -- -D warnings

      - name: Typecheck and build the UI
        run: pnpm --filter @epaper-studio/studio build

      # A tag that disagrees with the manifest would ship binaries whose
      # in-app version does not match the release.
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          manifest=$(node -p "require('./$APP_DIR/src-tauri/tauri.conf.json').version")
          tagged="${GITHUB_REF_NAME#v}"
          echo "manifest: $manifest, tag: $tagged"
          if [ "$manifest" != "$tagged" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $manifest"
            exit 1
          fi

  build:
    name: "Build ${{ matrix.name }}"
    needs: check
    permissions:
      # Needed only to create the release on a tag push.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal binary covers both Apple Silicon and Intel Macs.
          - name: "macOS (universal)"
            slug: macos-universal
            runner: macos-14
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            args: "--target universal-apple-darwin"
          # 22.04 rather than latest: the AppImage then runs on older glibc too.
          - name: "Linux (x86_64)"
            slug: linux-x86_64
            runner: ubuntu-22.04
            rust-targets: "x86_64-unknown-linux-gnu"
            args: ""
          - name: "Windows (x86_64)"
            slug: windows-x86_64
            runner: windows-latest
            rust-targets: "x86_64-pc-windows-msvc"
            args: ""

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"

      - name: Read the app version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./$APP_DIR/src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/studio/src-tauri
          key: ${{ matrix.slug }}

      # Scoped to this app: the landing site's toolchain is not needed here.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @epaper-studio/studio...

      # Builds the UI via the app's `beforeBuildCommand`, then bundles:
      # .dmg on macOS, .msi and .exe on Windows, .deb/.rpm/.AppImage on Linux.
      # On a tag it also creates the draft release and attaches everything.
      #
      # The bundles are unsigned, so macOS and Windows will warn on first run.
      # To sign them, add the certificate secrets Tauri documents at
      # https://tauri.app/distribute/sign/ and pass them through here.
      - name: Build the app
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/studio
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "E-Paper Studio ${{ steps.version.outputs.version }}"
          releaseBody: "Download the installer for your system below, then see apps/studio/README.md for what to do with it."
          releaseDraft: true
          includeUpdaterJson: false

      # tauri-action reports the bundles it produced as a JSON array. Keep the
      # installers and skip the loose `.app`, which is already inside the .dmg.
      - name: Collect the installers
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          mkdir -p installers
          node -e '
            const paths = JSON.parse(process.env.ARTIFACT_PATHS)
            const keep = [".dmg", ".AppImage", ".deb", ".rpm", ".msi", ".exe"]
            for (const path of paths) {
              if (keep.some((extension) => path.endsWith(extension))) console.log(path)
            }
          ' > paths.txt
          cat paths.txt
          while IFS= read -r path; do
            [ -n "$path" ] && cp "$path" installers/
          done < paths.txt
          ls -l installers

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: epaper-studio-${{ matrix.slug }}
          path: installers/*
          if-no-files-found: error
          retention-days: 14

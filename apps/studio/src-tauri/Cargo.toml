[package]
name = "epaper-studio"
version = "0.1.0"
description = "Calendar and photo generator for Waveshare PhotoPainter e-paper displays"
authors = ["u11g.com"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "epaper_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
epaper-core = { path = "crates/epaper-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }

# Only for the webview version check, which runs before Tauri has a window to
# host a dialog. Already in the tree through tauri-plugin-dialog.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = { version = "0.16", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

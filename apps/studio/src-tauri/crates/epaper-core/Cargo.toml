# Standalone workspace: epaper-core carries no Tauri dependency, so it can be
# built and tested without a webview toolchain installed.
[workspace]

[package]
name = "epaper-core"
version = "0.1.0"
edition = "2021"
description = "Image pipeline for Waveshare PhotoPainter e-paper displays"
license = "MIT"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }

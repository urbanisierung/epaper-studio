<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>E-Paper Studio</title>
		<style>
			body {
				font: 15px/1.5 system-ui, sans-serif;
				color: #111;
				background: #fff;
				max-width: 36rem;
				margin: 2.5rem auto;
				padding: 0 1.5rem;
			}
			h1 {
				font-size: 1.4rem;
				margin: 0 0 1rem;
			}
			.link {
				display: flex;
				gap: 0.5rem;
				margin: 1rem 0;
			}
			input {
				flex: 1;
				font: 13px ui-monospace, monospace;
				padding: 0.5rem;
				border: 1px solid #999;
				border-radius: 4px;
			}
			button {
				font: inherit;
				padding: 0.5rem 1rem;
			}
			.small {
				font-size: 12px;
				color: #555;
			}
		</style>
	</head>
	<body>
		<main>
			<h1 id="title">E-Paper Studio</h1>
			<p id="why"></p>
			<p id="how"></p>
			<div class="link">
				<input id="url" readonly aria-label="Link" />
				<button id="copy" type="button"></button>
			</div>
			<p id="keep"></p>
			<p id="pickers"></p>
			<p id="engine" class="small"></p>
		</main>
		<script src="/browser-mode.js"></script>
	</body>
</html>
